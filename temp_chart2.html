<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body {
        margin: 0;
        padding: 20px;
        background: #FFFFFF;
        color: #0F172A;
        font-family: 'Inter', sans-serif;
        width: 750px;
        box-sizing: border-box;
        border: 1px solid #E2E8F0;
        border-radius: 6px;
    }
    .title {
        font-size: 16px;
        font-weight: 700;
        color: #0F172A;
        margin-bottom: 2px;
    }
    .subtitle {
        font-size: 12px;
        color: #64748B;
        margin-bottom: 18px;
    }
    .grid {
        display: flex;
        gap: 16px;
    }
    .card {
        flex: 1;
        background: #F8FAFC;
        border: 1px solid #CBD5E1;
        border-radius: 6px;
        padding: 14px;
        text-align: center;
    }
    .card-title {
        font-size: 12px;
        color: #475569;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .card-val {
        font-size: 22px;
        font-weight: 700;
        color: #0F172A;
        margin-top: 6px;
    }
    .card-label {
        font-size: 11px;
        color: #64748B;
        margin-top: 4px;
    }
</style>
</head>
<body>
    <div class="title">Bilan Financier & Impact Métropolitain</div>
    <div class="subtitle">Modèle d'IA Frugale & Rigueur Budgétaire Certifiée (Données Annuelles)</div>
    
    <div class="grid">
        <div class="card">
            <div class="card-title">Audit Commande Publique</div>
            <div class="card-val" style="color: #059669;">+2,50 M€</div>
            <div class="card-label">Économies nettes / an certifiées</div>
        </div>
        <div class="card">
            <div class="card-title">Coût Budget IA Total</div>
            <div class="card-val" style="color: #DC2626;">0,50 M€</div>
            <div class="card-label">Co-financé par l'UE</div>
        </div>
        <div class="card">
            <div class="card-title">Bénéfice Net Public</div>
            <div class="card-val" style="color: #1E3A8A;">+2,00 M€</div>
            <div class="card-label">Réinjectés dans le service public</div>
        </div>
    </div>
</body>
</html>
